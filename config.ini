# TagIt Pro Configuration File
# Customize these settings to match your needs

[DATABASE]
# Path to SQLite database file
db_path = tagit_pro.db

[OUTPUT]
# Base folder for storing QR codes
base_output_folder = stickers

# Create category subfolders automatically
create_category_folders = true

[QR_CODE]
# QR code generation settings
box_size = 10              # Size of each box in pixels (higher = larger)
border = 4                 # Border thickness in boxes
version = 1                # QR code version (1-40, auto-sizing recommended)

# Enable/disable color coding
enable_color_coding = true

# Hex color codes for each tier
color_non_electronic = #000000        # Black
color_standard_electronic = #2E7D32   # Green
color_premium_electronic = #1A73E8    # Blue

[PRICING]
# Price per item in Nigerian Naira (₦)
price_non_electronic = 200
price_standard_electronic = 500
price_premium_electronic = 1000

[VERIFICATION]
# Verification URL base (students redirect here)
verification_url_base = https://tagitpro.com/verify/

# Enable verification logging
log_verifications = true

[EXPORT]
# CSV export settings
export_format = csv
include_qr_paths = true
timestamp_manifests = true

[LOGGING]
# Application logging
log_level = INFO           # DEBUG, INFO, WARNING, ERROR, CRITICAL
log_file = tagit_pro.log
log_to_console = true

[UI]
# User interface settings
clear_screen_on_menu = true
show_progress_bars = true
use_colors = true

[BATCH_GENERATION]
# Default batch sizes
default_ne_count = 10
default_se_count = 10
default_pe_count = 10

# Batch size limits
max_batch_size = 10000

[BACKUP]
# Automatic backup settings
enable_auto_backup = true
backup_interval_days = 7
backup_folder = backups/

[SECURITY]
# Security features
enable_twin_code_verification = true
track_verification_attempts = true
max_verification_attempts = 5
